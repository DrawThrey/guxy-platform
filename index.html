<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUXY - 游戏交互设计AI工作流平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }
    .loading-container { text-align: center; animation: fadeIn 0.8s ease-out; }
    .logo { font-size: 64px; margin-bottom: 16px; }
    .title { font-size: 32px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 16px; opacity: 0.9; margin-bottom: 24px; }
    .spinner {
      width: 48px; height: 48px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      margin: 0 auto 16px;
      animation: spin 1s linear infinite;
    }
    .manual-link {
      display: inline-block; margin-top: 16px; padding: 10px 20px;
      border-radius: 999px; border: 1px solid rgba(255,255,255,0.7);
      color: #fff; text-decoration: none; font-size: 14px;
      backdrop-filter: blur(8px);
      background: rgba(255,255,255,0.12);
      transition: all 0.2s ease;
    }
    .manual-link:hover { background: rgba(255,255,255,0.2); transform: translateY(-1px); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="logo">🎮</div>
    <div class="title">GUXY</div>
    <div class="subtitle">游戏交互设计AI工作流平台</div>
    <div class="spinner"></div>
    <p>正在加载应用...</p>
    <p style="margin-top: 24px; font-size: 14px; opacity: 0.85;">
      如果没有自动跳转，请
      <a href="GUXY/online/index.html" class="manual-link">点击这里进入 GUXY</a>
    </p>
  </div>

  <script>
    // 在 GitHub Pages 或本地服务器下，都从仓库根目录跳转到 GUXY 在线入口
    setTimeout(function () {
      window.location.href = 'GUXY/online/index.html';
    }, 600);
  </script>
</body>
</html>
