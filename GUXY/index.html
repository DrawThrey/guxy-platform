<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUXY - 游戏交互设计AI工作流平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .loading-container {
      text-align: center;
      color: white;
      animation: fadeIn 1s ease-in-out;
    }
    
    .logo {
      font-size: 64px;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }
    
    .title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    
    .subtitle {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 30px;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    
    .manual-link {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      transition: all 0.3s;
      display: inline-block;
    }
    
    .manual-link:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="logo">🎮</div>
    <div class="title">GUXY</div>
    <div class="subtitle">游戏交互设计AI工作流平台</div>
    <div class="spinner"></div>
    <p>正在加载应用...</p>
    <p style="margin-top: 30px; font-size: 14px; opacity: 0.8;">
      如果没有自动跳转，请 
      <a href="online/index.html" class="manual-link">点击这里</a>
    </p>
  </div>
  
  <script>
    // 自动重定向到GUXY应用
    // 支持GitHub Pages子目录部署
    (function() {
        var path = window.location.pathname;
        var baseDir = path.substring(0, path.lastIndexOf('/'));
        window.location.href = baseDir + '/GUXY/online/index.html';
    })();
  </script>
</body>
</html>
