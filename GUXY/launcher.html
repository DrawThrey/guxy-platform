<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUXY 启动器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
      text-align: center;
    }
    
    .logo {
      font-size: 64px;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    h1 {
      font-size: 32px;
      color: #333;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #666;
      font-size: 16px;
      margin-bottom: 30px;
    }
    
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .btn {
      padding: 15px 30px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #7C3AED 0%, #8B5CF6 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.5);
    }
    
    .btn-secondary {
      background: #f3f4f6;
      color: #333;
    }
    
    .btn-secondary:hover {
      background: #e5e7eb;
      transform: translateY(-2px);
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .status {
      margin-top: 30px;
      padding: 15px;
      border-radius: 10px;
      background: #f9fafb;
      text-align: left;
    }
    
    .status-title {
      font-weight: 600;
      margin-bottom: 10px;
      color: #333;
    }
    
    .status-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 14px;
      color: #666;
    }
    
    .status-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    
    .status-icon.success {
      background: #10B981;
      color: white;
    }
    
    .status-icon.error {
      background: #EF4444;
      color: white;
    }
    
    .status-icon.pending {
      background: #F59E0B;
      color: white;
    }
    
    .info {
      margin-top: 30px;
      padding: 15px;
      background: #EFF6FF;
      border-radius: 10px;
      border-left: 4px solid #3B82F6;
      text-align: left;
    }
    
    .info-title {
      font-weight: 600;
      color: #1E40AF;
      margin-bottom: 8px;
    }
    
    .info-content {
      font-size: 14px;
      color: #3B82F6;
      line-height: 1.6;
    }
    
    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🎮</div>
    <h1>GUXY 启动器</h1>
    <p class="subtitle">游戏交互设计AI工作流平台</p>
    
    <div class="button-group">
      <button id="btn-launch" class="btn btn-primary">
        <span>🚀</span>
        <span>启动 GUXY</span>
      </button>
      
      <button id="btn-open" class="btn btn-secondary">
        <span>📂</span>
        <span>打开 online 文件夹</span>
      </button>
    </div>
    
    <div class="status" id="status-panel" style="display: none;">
      <div class="status-title">系统状态检查</div>
      <div class="status-item">
        <span class="status-icon pending" id="status-browser">?</span>
        <span>浏览器支持</span>
      </div>
      <div class="status-item">
        <span class="status-icon pending" id="status-localstorage">?</span>
        <span>本地存储</span>
      </div>
      <div class="status-item">
        <span class="status-icon pending" id="status-indexeddb">?</span>
        <span>IndexedDB</span>
      </div>
      <div class="status-item">
        <span class="status-icon pending" id="status-canvas">?</span>
        <span>Canvas API</span>
      </div>
    </div>
    
    <div class="info">
      <div class="info-title">💡 使用提示</div>
      <div class="info-content">
        <p><strong>直接启动：</strong>点击"启动 GUXY"按钮直接打开应用</p>
        <p><strong>本地服务器：</strong>如需完整功能，请使用本地服务器运行</p>
        <p><strong>推荐浏览器：</strong>Chrome、Firefox、Safari、Edge 最新版本</p>
      </div>
    </div>
  </div>
  
  <script>
    // 检查系统状态
    function checkSystemStatus() {
      const statusPanel = document.getElementById('status-panel');
      statusPanel.style.display = 'block';
      
      // 浏览器支持
      const browserIcon = document.getElementById('status-browser');
      if ('localStorage' in window) {
        browserIcon.className = 'status-icon success';
        browserIcon.textContent = '✓';
      } else {
        browserIcon.className = 'status-icon error';
        browserIcon.textContent = '✕';
      }
      
      // 本地存储
      const localStorageIcon = document.getElementById('status-localstorage');
      try {
        localStorage.setItem('test', 'test');
        localStorage.removeItem('test');
        localStorageIcon.className = 'status-icon success';
        localStorageIcon.textContent = '✓';
      } catch (e) {
        localStorageIcon.className = 'status-icon error';
        localStorageIcon.textContent = '✕';
      }
      
      // IndexedDB
      const indexedDBIcon = document.getElementById('status-indexeddb');
      if ('indexedDB' in window) {
        indexedDBIcon.className = 'status-icon success';
        indexedDBIcon.textContent = '✓';
      } else {
        indexedDBIcon.className = 'status-icon error';
        indexedDBIcon.textContent = '✕';
      }
      
      // Canvas API
      const canvasIcon = document.getElementById('status-canvas');
      const canvas = document.createElement('canvas');
      if (canvas.getContext) {
        canvasIcon.className = 'status-icon success';
        canvasIcon.textContent = '✓';
      } else {
        canvasIcon.className = 'status-icon error';
        canvasIcon.textContent = '✕';
      }
    }
    
    // 启动GUXY
    function launchGUXY() {
      const btn = document.getElementById('btn-launch');
      btn.disabled = true;
      btn.innerHTML = '<div class="loading"></div><span>启动中...</span>';
      
      // 延迟启动，让用户看到加载状态
      setTimeout(() => {
        // 获取当前目录
        const currentPath = window.location.href;
        const onlinePath = currentPath.replace(/launcher\.html$/, 'online/index.html');
        
        // 在新窗口打开
        window.open(onlinePath, 'GUXY', 'width=1200,height=800');
        
        // 恢复按钮状态
        setTimeout(() => {
          btn.disabled = false;
          btn.innerHTML = '<span>🚀</span><span>启动 GUXY</span>';
        }, 1000);
      }, 500);
    }
    
    // 打开online文件夹
    function openOnlineFolder() {
      const currentPath = window.location.href;
      const onlinePath = currentPath.replace(/launcher\.html$/, 'online/');
      
      // 尝试打开文件夹（在某些浏览器中可能无效）
      window.open(onlinePath, '_blank');
    }
    
    // 绑定事件
    document.getElementById('btn-launch').addEventListener('click', launchGUXY);
    document.getElementById('btn-open').addEventListener('click', openOnlineFolder);
    
    // 自动检查系统状态
    setTimeout(checkSystemStatus, 500);
  </script>
</body>
</html>
