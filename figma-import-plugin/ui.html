<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { font-family: Inter, sans-serif; font-size: 12px; padding: 12px; margin: 0; }
    h2 { margin: 0 0 12px; font-size: 14px; }
    textarea { width: 100%; height: 200px; padding: 8px; font-family: monospace; font-size: 11px; resize: vertical; border: 1px solid #ddd; border-radius: 4px; }
    button { width: 100%; padding: 10px; margin-top: 8px; background: #0d99ff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button:hover { background: #0b85e0; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .hint { color: #666; font-size: 11px; margin-top: 8px; }
    .error { color: #f24822; font-size: 11px; margin-top: 4px; display: none; }
  </style>
</head>
<body>
  <h2>导入游戏架构</h2>
  <p class="hint">粘贴架构 JSON 内容（collections、cards 等），或从 GUXY 导出的 architecture.json 文件复制内容</p>
  <textarea id="jsonInput" placeholder='{"collections":[...],"cards":[...],...}'></textarea>
  <div class="error" id="error"></div>
  <button id="importBtn">生成 Figma 界面</button>
  <script>
    const textarea = document.getElementById('jsonInput');
    const importBtn = document.getElementById('importBtn');
    const errorEl = document.getElementById('error');
    
    importBtn.onclick = () => {
      const jsonStr = textarea.value.trim();
      if (!jsonStr) {
        showError('请粘贴 JSON 内容');
        return;
      }
      try {
        JSON.parse(jsonStr);
      } catch (e) {
        showError('JSON 格式错误: ' + e.message);
        return;
      }
      errorEl.style.display = 'none';
      importBtn.disabled = true;
      parent.postMessage({ pluginMessage: { type: 'import', json: jsonStr } }, '*');
    };
    
    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = 'block';
    }
    
    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg && msg.type === 'done') {
        importBtn.disabled = false;
        if (msg.error) showError(msg.error);
      }
    };
  </script>
</body>
</html>
